async function apiCall(path,body,opt){
 opt=opt||{};const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),opt.timeout||20000);
 try{
  const hd={'Content-Type':'application/json'};if(opt.admin&&API().token)hd.Authorization='Bearer '+API().token;
  const r=await fetch(apiBase()+path,{method:body?'POST':'GET',headers:hd,body:body?JSON.stringify(body):undefined,signal:ctl.signal});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j
 }catch(e){throw new Error(e.name==='AbortError'?'সময় শেষ (timeout)':e.message)}finally{clearTimeout(to)}
}

function shopList(inst){
 const q=($('#q')?.value||'').toLowerCase();

   if(popular.length)h+=`<section class="category-link"><h2 class="sec rvl">🔥 Popular Products</h2>${hs(popular)}</section>`;
   if(rvl.length)h+=`<section class="category-link"><h2 class="sec rvl">👀 Recently viewed</h2>${hs(rvl)}</section>`;if(sale.length)h+=`<section class="category-link"><h2 class="sec rvl">⚡ Sale & Offers</h2>${hs(sale)}</section>`;
    h+=bsecHtml('*');
   D.cats.forEach((c,ix)=>{const x=L.filter(p=>p.c===c);if(!x.length){h+=adsSlot('home-after:'+c);return}h+=`<section class="category-link"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><h2 class="sec rvl" onclick="openCategory('${esc(c)}')">${ci(c)} ${esc(cn(c))}</h2><button class="btn o s" onclick="openCategory('${esc(c)}')">See More →</button></div>${hs(x.slice(0,12))}</section>`+bsecHtml(c)+adsSlot('home-after:'+c)});
 }else{
   const cs=cat==='*'||q?[...new Set([...D.cats,...D.products.map(p=>p.c)])]:[cat];

}

let pend='',pendG=[];
function shrink(file,max=640){return new Promise((ok,no)=>{if(!/^image\/(jpeg|png|webp)$/.test(file.type))return no('type');const r=new FileReader();r.onerror=()=>no('read');r.onload=()=>{const im=new Image();im.onerror=()=>no('img');im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(file)})}

function shrinkBanner(file,max){return new Promise((ok,no)=>{if(!/^image\/(jpeg|png|webp)$/.test(file.type))return no('type');const r=new FileReader();r.onerror=()=>no('read');r.onload=()=>{const im=new Image();im.onerror=()=>no('img');im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.74))};im.src=r.result};r.readAsDataURL(file)})}

async function importData(el){const f=el.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j.D)throw 0;D=j.D;for(const k in (j.IMG||{})){IMG[k]=j.IMG[k];await idbPut(k,j.IMG[k])}save();toast('ডেটা আনা হয়েছে ✅');route()}catch(e){toast('ফাইলটি ঠিক নয়')}}
const sig=u=>new Promise(ok=>{const im=new Image();im.onerror=()=>ok(null);im.onload=()=>{try{const c=document.createElement('canvas');c.width=9;c.height=8;const x=c.getContext('2d');x.drawImage(im,0,0,9,8);const d=x.getImageData(0,0,9,8).data,g=i=>d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11;let b='';for(let y=0;y<8;y++)for(let k=0;k<8;k++)b+=g(y*9+k)>g(y*9+k+1)?1:0;const c2=document.createElement('canvas');c2.width=c2.height=3;const y2=c2.getContext('2d');y2.drawImage(im,0,0,3,3);ok({b,c:[...y2.getImageData(0,0,3,3).data].filter((_,i)=>i%4<3)})}catch(e){ok(null)}};im.src=u});

async function chPic(el){const f=el.files[0];el.value='';if(!f)return;const u=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});chPush(`<img src="${u}" style="max-width:160px;border-radius:10px">`,0,1);
 const h=await sig(u),R=[];for(const p of D.products){let m=99;for(const s of allImgs(p)){const g=await sig(s);if(!g||!h)continue;let d=0,cd=0;for(let i=0;i<64;i++)if(h.b[i]!==g.b[i])d++;for(let i=0;i<27;i++)cd+=Math.abs(h.c[i]-g.c[i]);m=Math.min(m,d+cd/27/5)}if(m<99)R.push([m,p])}
 R.sort((a,b)=>a[0]-b[0]);const nm=f.name.toLowerCase().replace(/\.[a-z0-9]+$/,''),fn=D.products.find(p=>nm.length>2&&nm.includes(p.n.toLowerCase()));
 if(fn)R.unshift([0,fn]);else if(R.length&&R[0][0]>26)R.length=0;
 if(!R.length)return chHuman('ছবি থেকে পণ্য মেলাতে পারিনি। পণ্যের নাম লিখুন বা সরাসরি যোগাযোগ করুন:');
 chPush(chCard(R[0][1],R[0][0]>16),1,1);const o=R.slice(1,3).filter(x=>x[1]!==R[0][1]);if(o.length)chPush('অন্য কাছাকাছি পণ্য:<div class="chl">'+o.map(x=>`<button type="button" onclick="openP(${x[1].id})">${esc(x[1].e||'')} ${esc(x[1].n)} · ${tk(pp(x[1]))}</button>`).join('')+'</div>',1,1)}

<script id="fm-cloud">
/* ===== ✏️ শুধু এই এক লাইন বদলান: Supabase → Project Settings → API থেকে URL ও anon public key ===== */
window.FM_CLOUD={url:'',key:''};
/* ======================================================================================== */
(()=>{
const C=window.FM_CLOUD,U=(C.url||'').replace(/\/+$/,''),ON=!!(U&&C.key),PRIV=['orders','customers','accounts','wishlists'],SK='fm_sess';
const st={t:ON?'wait':'off',m:'',at:0};const setSt=(t,m)=>{st.t=t;st.m=m||'';st.at=Date.now();if(t==='err')toast('⚠️ ক্লাউডে সেভ হয়নি: '+(m||''))};
/* footer legal links (shown only when the generator built the static pages) */
if(document.querySelector('meta[name="fm-static"]')){const f=$('#foot');if(f)new MutationObserver(()=>{if(!f.querySelector('.fm-legal'))f.insertAdjacentHTML('beforeend','<div class="fm-legal"><a href="privacy/">প্রাইভেসি পলিসি</a><a href="refund/">রিফান্ড ও রিটার্ন</a><a href="terms/">শর্তাবলি</a></div>')}).observe(f,{childList:true})}
window.cloudAdm=()=>{const s=sess();$('#ab').innerHTML=`<div class="panel"><h2 style="margin-top:0">☁️ ক্লাউড সংযোগ (Supabase)</h2>${ON?`<p>অবস্থা: <b>${s?(st.t==='ok'?'✅ সংযুক্ত ও সেভ হচ্ছে':st.t==='err'?'⚠️ সমস্যা: '+esc(st.m):'⏳ সংযুক্ত'):'🔒 লগইন করা নেই'}</b></p><p style="color:var(--mu)">Supabase: ${esc(U)}<br>লগইন: ${esc(s&&s.em||'—')}${localStorage.getItem('fm_dirty')==='1'?'<br>⚠️ কিছু পরিবর্তন এখনো ক্লাউডে যায়নি':''}</p>
<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="fmCloudSync('up')">⬆️ এখনই ক্লাউডে সেভ</button><button class="btn o" onclick="fmCloudSync('down')">⬇️ ক্লাউড থেকে নামান</button><button class="btn o" onclick="fmCloudSync('orders')">🧾 নতুন অর্ডার আনুন</button></div>`:`<p style="color:var(--mu)">ক্লাউড এখনো চালু হয়নি, তাই ডেটা শুধু এই ব্রাউজারে থাকছে। ফাইলের শুরুর দিকে <code>window.FM_CLOUD</code> লাইনে Supabase-এর url ও key বসান (গাইড: SETUP-BN.md)।</p>`}</div>`};
if(!ON)return;
/* ---------- auth ---------- */
const H=(tok,x)=>Object.assign({apikey:C.key,Authorization:'Bearer '+(tok||C.key),'Content-Type':'application/json'},x||{});
function sess(){try{return JSON.parse(localStorage.getItem(SK))}catch(e){return null}}
const setSess=s=>{try{s?localStorage.setItem(SK,JSON.stringify(s)):localStorage.removeItem(SK)}catch(e){}};
async function token(){let s=sess();if(!s)return null;if(s.exp-Date.now()>60000)return s.at;
 try{const r=await fetch(U+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:H(),body:JSON.stringify({refresh_token:s.rt})}),j=await r.json();if(!j.access_token)throw 0;s={at:j.access_token,rt:j.refresh_token,exp:Date.now()+j.expires_in*1000,em:s.em};setSess(s);return s.at}catch(e){return null}}
async function isAdmin(tok){try{const r=await fetch(U+'/rest/v1/rpc/is_admin',{method:'POST',headers:H(tok),body:'{}'});return (await r.json())===true}catch(e){return false}}
window.fmAdminLogin=async(em,pw)=>{try{const r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:H(),body:JSON.stringify({email:em,password:pw})}),j=await r.json();if(!j.access_token||!await isAdmin(j.access_token))return false;setSess({at:j.access_token,rt:j.refresh_token,exp:Date.now()+j.expires_in*1000,em});await firstSync();return true}catch(e){return false}};
window.login=()=>{$('#app').innerHTML=`<div class="panel" style="max-width:380px;margin:60px auto"><h2 style="margin-top:0">🔐 অ্যাডমিন লগইন</h2><div class="f"><input id="ae" type="email" placeholder="ইমেইল" autocomplete="username"><input id="ap" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><button class="btn" onclick="doLogin()">লগইন</button></div></div>`};
window.doLogin=async()=>{const em=$('#ae').value.trim(),pw=$('#ap').value;if(!em||!pw)return toast('ইমেইল ও পাসওয়ার্ড দিন');
 try{const r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:H(),body:JSON.stringify({email:em,password:pw})}),j=await r.json();
  if(!j.access_token)return toast('লগইন ব্যর্থ: ইমেইল বা পাসওয়ার্ড ভুল');
  if(!await isAdmin(j.access_token))return toast('এই ইমেইল অ্যাডমিন তালিকায় নেই (SQL-এ যোগ করুন)');
  setSess({at:j.access_token,rt:j.refresh_token,exp:Date.now()+j.expires_in*1000,em});
  admin=true;try{sessionStorage.setItem('fm_a','1')}catch(e){}
  await firstSync();route()}catch(e){toast('ইন্টারনেট সমস্যা, আবার চেষ্টা করুন')}};
const _lo=window.logout;window.logout=()=>{setSess(null);return _lo()};
/* ---------- pull public data (everyone) ---------- */
async function pullPublic(){const r=await fetch(U+'/rest/v1/site_data?key=eq.public&select=value',{headers:H()});if(!r.ok)throw new Error('pull '+r.status);const a=await r.json();return a[0]&&a[0].value}
function merge(pub){const pass=D.shop&&D.shop.pass,api=D.shop&&D.shop.api;
 for(const k in pub){if(PRIV.includes(k))continue;if(k==='shop'){D.shop=Object.assign({},D.shop,pub.shop);if(pass!==undefined)D.shop.pass=pass;if(api)D.shop.api=api}else D[k]=pub[k]}
 try{(D.i18n||[]).forEach(e=>__fmI18n.add(e.v))}catch(e){}try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
async function firstSync(){try{const pub=await pullPublic();if(pub&&pub.products)merge(pub);else await push()}catch(e){setSt('err',e.message)}await pullOrders()}
/* ---------- push (admin only) ---------- */
const isImg=s=>typeof s==='string'&&(/^data:(image|video)\//.test(s)||(s.length<48&&IMG[s]&&String(IMG[s]).startsWith('data:')));
async function up(du,tok){const m=du.match(/^data:([^;,]+);base64,([\s\S]*)$/);if(!m)return null;
 const mime=m[1],ext=(mime.split('/')[1]||'bin').replace('jpeg','jpg').replace(/[^a-z0-9]/gi,''),bin=Uint8Array.from(atob(m[2]),c=>c.charCodeAt(0));
 let nm;try{nm=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bin))].slice(0,10).map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(let i=0;i<du.length;i+=5)h=(h*31+du.charCodeAt(i))|0;nm=Math.abs(h).toString(36)+du.length.toString(36)}
 const r=await fetch(U+'/storage/v1/object/images/'+nm+'.'+ext,{method:'POST',headers:{apikey:C.key,Authorization:'Bearer '+tok,'Content-Type':mime,'x-upsert':'true'},body:bin});
 if(!r.ok)throw new Error('ছবি আপলোড '+r.status);return U+'/storage/v1/object/public/images/'+nm+'.'+ext}
async function lift(o,tok){for(const k of Object.keys(o)){const v=o[k];if(typeof v==='string'){if(isImg(v)){const u=await up(v.startsWith('data:')?v:IMG[v],tok);if(u)o[k]=u}}else if(v&&typeof v==='object')await lift(v,tok)}}
const lastO={};let timer=null,busy=false,again=false;
window.fmCloudPush=()=>{if(!sess())return;try{localStorage.setItem('fm_dirty','1')}catch(e){}clearTimeout(timer);timer=setTimeout(()=>push(),2000)};
async function push(){if(busy){again=true;return}busy=true;
 try{const tok=await token();if(!tok)throw new Error('আবার লগইন করুন');
  for(const k of Object.keys(D))if(!PRIV.includes(k)&&D[k]&&typeof D[k]==='object')await lift(D[k],tok);
  const pub={};for(const k of Object.keys(D))if(!PRIV.includes(k))pub[k]=D[k];pub.shop=Object.assign({},D.shop);delete pub.shop.pass;delete pub.shop.api;
  try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}
  let r=await fetch(U+'/rest/v1/site_data?on_conflict=key',{method:'POST',headers:H(tok,{Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({key:'public',value:pub,updated_at:new Date().toISOString()})});
  if(!r.ok)throw new Error('সেভ '+r.status+' '+(await r.text()).slice(0,100));
  const rows=[];for(const o of D.orders){const s=JSON.stringify(o);if(lastO[o.id]!==s){rows.push({id:o.id,data:o});lastO[o.id]=s}}
  if(rows.length){r=await fetch(U+'/rest/v1/orders?on_conflict=id',{method:'POST',headers:H(tok,{Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(rows)});if(!r.ok){rows.forEach(x=>delete lastO[x.id]);throw new Error('অর্ডার সেভ '+r.status)}}
  try{localStorage.removeItem('fm_dirty')}catch(e){}setSt('ok')}
 catch(e){setSt('err',e.message)}finally{busy=false;if(again){again=false;window.fmCloudPush()}}}
/* ---------- orders ---------- */
window.fmOid=()=>(Math.floor(Date.now()/1000)-1700000000)*10+Math.floor(Math.random()*10);
const OQ='fm_oq',oq=()=>{try{return JSON.parse(localStorage.getItem(OQ))||[]}catch(e){return[]}};
async function flushQ(){const q=oq();if(!q.length||!navigator.onLine)return;const left=[];
 for(const o of q){try{const r=await fetch(U+'/rest/v1/orders?on_conflict=id',{method:'POST',headers:H(null,{Prefer:'resolution=ignore-duplicates,return=minimal'}),body:JSON.stringify({id:o.id,data:o})});if(!r.ok)left.push(o)}catch(e){left.push(o)}}
 try{localStorage.setItem(OQ,JSON.stringify(left))}catch(e){}}
window.fmCloudOrder=o=>{try{const q=oq();q.push(o);localStorage.setItem(OQ,JSON.stringify(q))}catch(e){}flushQ()};
async function pullOrders(){const tok=await token();if(!tok)return;
 try{const r=await fetch(U+'/rest/v1/orders?select=data&order=id.desc&limit=1000',{headers:H(tok)});if(!r.ok)return;const a=await r.json();let n=0;
  for(const row of a){const o=row.data;if(!o||D.orders.some(x=>x.id===o.id)){if(o&&!lastO[o.id]){const l=D.orders.find(x=>x.id===o.id);if(l&&JSON.stringify(l)===JSON.stringify(o))lastO[o.id]=JSON.stringify(o)}continue}
   lastO[o.id]=JSON.stringify(o);D.orders.push(o);n++;
   if(o.status!=='বাতিল')(o.items||[]).forEach(i=>{const p=D.products.find(x=>x.id===i.id);if(p){p.s=Math.max(0,p.s-i.q);if(i.size&&p.ss&&p.ss[i.size]!=null)p.ss[i.size]=Math.max(0,p.ss[i.size]-i.q)}});
   const c=D.customers[o.phone]||{name:o.name,phone:o.phone,addr:o.addr,orders:0,spent:0};Object.assign(c,{name:o.name,addr:o.addr,last:o.date});c.orders++;c.spent+=o.total||0;D.customers[o.phone]=c}
  if(n){D.orders.sort((x,y)=>y.id-x.id);save();toast('🧾 নতুন অর্ডার: '+n+'টি');if(location.hash==='#admin'&&tab==='ord'&&typeof ord==='function')ord()}}catch(e){}}
window.fmCloudSync=async k=>{if(!await token())return toast('আগে লগইন করুন');toast('চলছে…');
 if(k==='up'){await push()}else if(k==='down'){try{const p=await pullPublic();if(p){merge(p);route()}}catch(e){setSt('err',e.message)}}else await pullOrders();
 if(tab==='cloud')cloudAdm();toast(st.t==='err'?'⚠️ '+st.m:'✅ হয়েছে')};
setInterval(()=>{if(admin&&sess())pullOrders()},30000);addEventListener('online',()=>{flushQ();if(sess()&&localStorage.getItem('fm_dirty')==='1')push()});
/* ---------- boot ---------- */
(async()=>{document.body.classList.add('fm-ld');const guard=setTimeout(()=>document.body.classList.remove('fm-ld'),5000);
 try{await flushQ();const dirty=localStorage.getItem('fm_dirty')==='1';
  if(dirty&&await token())await push();else{const pub=await pullPublic();if(pub&&pub.products)merge(pub);setSt('ok')}}
 catch(e){setSt(sess()?'err':'off',e.message)}
 finally{clearTimeout(guard);document.body.classList.remove('fm-ld');try{route()}catch(e){}if(admin&&sess())pullOrders()}})();
})();
</script>

<script id="fm-ux">

 return k}

 let m=s.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/);
 if(m)return`<iframe src="https://www.youtube-nocookie.com/embed/${m[1]}?rel=0${v.auto?'&autoplay=1&mute=1&loop=1&playlist='+m[1]:''}" title="${esc(v.t||'Video')}" loading="lazy" allow="accelerometer;autoplay;encrypted-media;picture-in-picture;fullscreen" allowfullscreen></iframe>`;
 m=s.match(/vimeo\.com\/(?:video\/)?(\d+)/);if(m)return`<iframe src="https://player.vimeo.com/video/${m[1]}" title="${esc(v.t||'Video')}" loading="lazy" allow="autoplay;fullscreen;picture-in-picture" allowfullscreen></iframe>`;

 return`<video src="${esc(s)}" controls playsinline preload="metadata"${v.auto?' autoplay muted loop':''}></video>`}

function injMb(){const mb=$('#mb');if(!mb||!mb.children.length||mb.querySelector('.fmv'))return;const L=pick(['product']);if(!L.length)return;
 const t=L.filter(v=>v.pos==='top').map(blk).join(''),b=L.filter(v=>v.pos!=='top').map(blk).join('');if(t)mb.insertAdjacentHTML('afterbegin',t);if(b)mb.insertAdjacentHTML('beforeend',b)}

setTimeout(injApp,300);

 if(op==='add'){const t=$('#vt').value.trim(),u=$('#vu').value.trim();if(!u)return toast('ভিডিওর লিংক দিন বা ফাইল আপলোড করুন');D.vids.push({id:'v'+Date.now().toString(36),t,kind:'url',src:u,page:$('#vp').value,pos:$('#vo').value,auto:$('#va').checked,on:true});save();toast('ভিডিও যোগ হয়েছে ✅');vidsAdm()}
 else if(op==='rm'){if(!confirm('এই ভিডিও মুছবেন?'))return;D.vids.splice(i,1);save();vidsAdm()}

 if(f.size>40*1048576)return toast('ফাইল ৪০MB এর বেশি। বড় ভিডিও YouTube-এ আপলোড করে লিংক দিন।');
 toast('ভিডিও আপলোড হচ্ছে…');const du=await new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>ok(null);r.readAsDataURL(f)});if(!du)return toast('ফাইল পড়া যায়নি');
 const id=await putImg(du);D.vids.push({id:'v'+Date.now().toString(36),t:$('#vt').value.trim(),kind:'file',src:id,page:$('#vp').value,pos:$('#vo').value,auto:$('#va').checked,on:true});save();toast('ভিডিও সেভ হয়েছে ✅');vidsAdm()};
window.vidsAdm=()=>{const op=(a,s)=>a.map(x=>`<option value="${esc(x[0])}" ${x[0]===s?'selected':''}>${esc(x[1])}</option>`).join('');

 <input type="file" id="vf" accept="video/*" hidden onchange="fmVidUp(this)">
 <div class="fmx-g"><label>শিরোনাম (ঐচ্ছিক)<input id="vt" placeholder="যেমন: নতুন কালেকশন"></label><label>ভিডিও লিংক<input id="vu" placeholder="https://youtube.com/watch?v=…"></label><label>কোন পেজে<select id="vp">${op(PG(),'home')}</select></label><label>কোথায়<select id="vo">${op(POS,'top')}</select></label><label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="va" style="width:auto"> নিজে নিজে চলবে (মিউট)</label></div>

  if(!a.querySelector('.ai'))a.insertAdjacentHTML('afterbegin',S(IC[id]||IC.dash))});
 document.querySelectorAll('.adm-acts .btn').forEach((b,i)=>{const t=[...b.childNodes].find(x=>x.nodeType===3);if(t)t.nodeValue=t.nodeValue.replace(PIC,'');if(!b.querySelector('.ai'))b.insertAdjacentHTML('afterbegin',S(i?IC.plus:IC.store))})};
const _adm=window.adm;window.adm=function(){const r=_adm.apply(this,arguments);try{skinAdm()}catch(e){}return r};
/* home: SVG icons on circles, service cards, contact tiles */
const skinHome=app=>{const f=['truck','pct','spark','prod'];app.querySelectorAll('.fmo button i').forEach((i,k)=>{i.innerHTML=S(IC[f[k]])});
 const sv=[['delivery','truck'],['payment','lock'],['genuine','shield'],['support','chat']];app.querySelectorAll('.service-trust button').forEach(b=>{const m=(b.getAttribute('onclick')||'').match(/service-(\w+)/),x=sv.find(y=>m&&y[0]===m[1]);const i=b.querySelector('i');if(x&&i)i.innerHTML=S(IC[x[1]])});
 app.querySelectorAll('.fmc-g a i').forEach(i=>{const t=i.textContent.trim();const k={'📞':'phone','💬':'chat','📍':'pin'}[t]||'link';i.innerHTML=S(IC[k])})};
const _s2=window.shop;window.shop=function(){const r=_s2.apply(this,arguments);try{const app=$('#app');if(app&&app.querySelector('.fmo'))skinHome(app)}catch(e){}return r};
try{route()}catch(e){}
})();

<script id="fm-users-js">
(function(){
try{ATL.circ=Array(7).fill('Home circle buttons');ATL.cus=Array(7).fill('Users & customers')}catch(e){}
const bn=()=>location.hash==='#admin'||/^bn/.test(document.documentElement.lang||'bn'),T=(b,e)=>bn()?b:e;
const now=()=>new Date().toLocaleString('en-GB');
const same=(a,b)=>String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase();
const findO=id=>D.orders.find(o=>String(o.id)===String(id));
const ordersOf=ph=>D.orders.filter(o=>same(o.phone,ph));
const myKeys=()=>{const c=D.accounts[currentCustomer]||{};return [currentCustomer,c.phone,c.email].filter(Boolean).map(x=>String(x).toLowerCase())};
const mine=id=>{const o=findO(id);return o&&myKeys().includes(String(o.phone||o.email||'').toLowerCase())?o:null};
const prodOf=id=>D.products.find(p=>String(p.id)===String(id));
const EN={'নতুন':'New','প্রসেসিং':'Processing','কুরিয়ারে':'With courier','ডেলিভারড':'Delivered','বাতিল':'Cancelled'};
const SC={'নতুন':'n','প্রসেসিং':'p','কুরিয়ারে':'c','ডেলিভারড':'','বাতিল':'x'};
const stLbl=s=>bn()?s:(EN[s]||s);
const pill=o=>`<span class="u-st ${SC[o.status]||''}">${esc(stLbl(o.status||'নতুন'))}</span>`;

function pth(id){const p=prodOf(id);if(!p)return '<span class="u-th">🛍️</span>';let im='';try{im=allImgs(p)[0]}catch(e){}if(im&&imgOk(im))return `<img class="u-th" loading="lazy" alt="${esc(p.n)}" src="${esc(resolve(im))}">`;return `<span class="u-th">${esc(p.e||'🛍️')}</span>`}
function avatar(name,photo,sz){const s=sz?`style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.4)}px"`:'';if(photo&&imgOk(photo))return `<span class="u-av" ${s}><img alt="" src="${esc(resolve(photo))}"></span>`;return `<span class="u-av" ${s}>${esc((String(name||'?').trim()[0]||'?').toUpperCase())}</span>`}
function flags(o){const f=[];
 if(o.status==='বাতিল'){f.push(o.ret&&o.ret.status==='approved'?`<span class="u-f c">↩️ ${T('ফেরত সম্পন্ন','Returned')}</span>`:`<span class="u-f c">❌ ${o.cancelBy==='customer'?T('ইউজার বাতিল করেছে','Cancelled by user'):T('বাতিল','Cancelled')}</span>`)}
 if(o.recvAt)f.push(`<span class="u-f g">✅ ${T('রিসিভ করেছে','Received')}</span>`);
 if(o.nr)f.push(`<span class="u-f o">📭 ${T('পার্সেল পায়নি','Parcel not received')}</span>`);
 if(o.ret&&o.ret.status==='requested')f.push(`<span class="u-f p">↩️ ${T('ফেরত চেয়েছে','Return requested')}</span>`);
 if(o.ret&&o.ret.status==='rejected')f.push(`<span class="u-f p">🚫 ${T('ফেরত বাতিল','Return rejected')}</span>`);
 return f.length?`<div class="u-fl">${f.join('')}</div>`:''}

/* ================= customer side ================= */
const canCancel=o=>['নতুন','প্রসেসিং'].includes(o.status||'নতুন');
const canRecv=o=>['কুরিয়ারে','ডেলিভারড'].includes(o.status)&&!o.recvAt&&!o.nr;
const canNR=o=>['কুরিয়ারে','ডেলিভারড'].includes(o.status)&&!o.recvAt&&!o.nr;
const canRet=o=>o.status==='ডেলিভারড'&&!o.ret;
const canRate=o=>o.status!=='বাতিল'&&(o.status==='ডেলিভারড'||o.recvAt);

window.uCancel=id=>{const o=mine(id);if(!o)return;if(!canCancel(o))return toast(T('এই অর্ডার আর বাতিল করা যাবে না','This order can no longer be cancelled'));
 const r=prompt(T('বাতিলের কারণ লিখুন (ঐচ্ছিক):','Reason for cancelling (optional):'),'');if(r===null)return;
 stO(o.id,'বাতিল');o.cancelBy='customer';o.cancelAt=now();o.cancelReason=String(r).trim();save();accountPage()};
window.uRecv=id=>{const o=mine(id);if(!o||!canRecv(o))return;o.recvAt=now();delete o.nr;save();toast(T('ধন্যবাদ! রিসিভ কনফার্ম হয়েছে ✅','Thanks! Marked as received ✅'));accountPage()};
window.uNR=id=>{const o=mine(id);if(!o||!canNR(o))return;if(!confirm(T('আপনি কি নিশ্চিত যে এই পার্সেল পাননি? আমরা বিষয়টি দেখব।','Confirm you have NOT received this parcel? We will look into it.')))return;o.nr={at:now()};save();toast(T('আমরা জানতে পেরেছি, শীঘ্রই যোগাযোগ করব','Noted — we will contact you soon'));accountPage()};
window.uRet=id=>{const o=mine(id);if(!o||!canRet(o))return;const r=prompt(T('ফেরত দেওয়ার কারণ লিখুন:','Why do you want to return it?'),'');if(r===null)return;if(!String(r).trim())return toast(T('কারণ লিখুন','Please write a reason'));
 o.ret={at:now(),reason:String(r).trim(),status:'requested'};save();toast(T('ফেরতের অনুরোধ পাঠানো হয়েছে','Return request sent'));accountPage()};
window.uRate=pid=>{const p=prodOf(pid);if(p)openP(p.id)};
window.uPhoto=async el=>{const f=el.files&&el.files[0];el.value='';if(!f)return;const c=D.accounts[currentCustomer];if(!c)return;
 try{c.photo=await putImg(await shrink(f,320));save();toast(T('ছবি সেভ হয়েছে ✅','Photo saved ✅'));accountPage()}catch(e){toast(T('শুধু JPG / PNG / WebP ছবি দিন','Use a JPG / PNG / WebP image'))}};
window.uPhotoDel=()=>{const c=D.accounts[currentCustomer];if(!c||!c.photo)return;c.photo='';save();accountPage()};

const _ap=window.accountPage;
window.accountPage=function(){
 const c=currentCustomer&&D.accounts[currentCustomer];if(!c)return _ap.apply(this,arguments);
 const keys=myKeys(),os=D.orders.filter(o=>keys.includes(String(o.phone||o.email||'').toLowerCase())).sort((a,b)=>(+b.id||0)-(+a.id||0)),
  nRecv=os.filter(o=>o.recvAt).length,nCan=os.filter(o=>o.status==='বাতিল').length,wl=(D.wishlists[currentCustomer]||[]).length;
 const card=o=>{const acts=[];
  acts.push(`<button class="btn o s" onclick="dlReceipt(${JSON.stringify(o.id).replace(/"/g,'&quot;')})">⬇️ ${tr('receipt')}</button>`);
  if(canCancel(o))acts.push(`<button class="btn d s" onclick="uCancel('${esc(o.id)}')">❌ ${T('অর্ডার বাতিল','Cancel order')}</button>`);
  if(canRecv(o))acts.push(`<button class="btn s" onclick="uRecv('${esc(o.id)}')">✅ ${T('পেয়েছি','Received')}</button>`);
  if(canNR(o))acts.push(`<button class="btn o s" onclick="uNR('${esc(o.id)}')">📭 ${T('পাইনি','Not received')}</button>`);
  if(canRet(o))acts.push(`<button class="btn o s" onclick="uRet('${esc(o.id)}')">↩️ ${T('ফেরত দিন','Return')}</button>`);
  const note=[];
  if(o.status==='বাতিল'&&o.cancelBy==='customer')note.push(T('আপনি এই অর্ডার বাতিল করেছেন','You cancelled this order')+(o.cancelAt?' · '+esc(o.cancelAt):''));
  if(o.ret)note.push(T('ফেরতের অবস্থা: ','Return status: ')+({requested:T('অপেক্ষমাণ','Pending'),approved:T('অনুমোদিত','Approved'),rejected:T('বাতিল','Rejected')}[o.ret.status]||''));
  if(o.nr)note.push(T('আপনি জানিয়েছেন পার্সেল পাননি — আমরা দেখছি','You reported this parcel as not received — we are checking'));
  return `<div class="panel u-ord"><div class="row"><b>${tr('ordNo')} #${esc(o.id)}</b>${pill(o)}</div>${flags(o)}
  <div class="u-its">${(o.items||[]).map(i=>`<div class="u-it">${pth(i.id)}<div><b>${esc(i.n)}</b><small>${i.size?'Size '+esc(i.size)+' · ':''}× ${i.q} · ${tk((+i.p||0)*(+i.q||0))}</small>${canRate(o)?`<a class="u-rl" onclick="uRate('${esc(i.id)}')">⭐ ${T('রিভিউ দিন','Review')}</a>`:''}</div></div>`).join('')}</div>
  <p style="margin:6px 0">${tr('orderDate')}: ${esc(o.date||'—')} · ${tr('total')}: <b>${tk(o.total)}</b></p>
  <p style="margin:6px 0">${tr('payment')}: ${esc(o.pay||'—')} · ${o.paid?tr('paid'):tr('pendingPay')}</p>
  ${o.track?`<p style="margin:6px 0">🚚 ${esc(o.courier||'')} · ${esc(o.track)}</p>`:''}
  ${note.map(n=>`<p class="u-note">${n}</p>`).join('')}<div class="u-act">${acts.join('')}</div></div>`};
 $('#app').innerHTML=`<div class="panel" style="margin:24px 0"><div class="u-head">
  <div class="u-pic">${avatar(c.name,c.photo)}<label class="u-cam" title="${T('ছবি যোগ/বদলান','Add / change photo')}">📷<input type="file" accept="image/jpeg,image/png,image/webp" hidden onchange="uPhoto(this)"></label></div>
  <div style="flex:1;min-width:180px"><h1 style="margin:0">${tr('welcome')}, ${esc(c.name)}</h1><div style="color:var(--mu)">${c.phone?'🆔 '+esc(c.phone):''} ${c.email?'✉️ '+esc(c.email):''}</div>${c.photo?`<a class="u-rl" style="margin:6px 0 0;display:inline-block" onclick="uPhotoDel()">🗑️ ${T('ছবি মুছুন','Remove photo')}</a>`:`<div class="u-note">${T('📷 ক্যামেরা আইকনে চাপ দিয়ে আপনার ছবি যোগ করুন','Tap 📷 to add your profile photo')}</div>`}</div>
  <button class="btn o s" onclick="customerLogout()">${tr('logout')}</button></div>
  <div class="kp" style="margin-top:16px"><div><small>${tr('orderCount')}</small><b>${os.length}</b></div><div><small>${T('রিসিভ করেছেন','Received')}</small><b>${nRecv}</b></div><div><small>${T('বাতিল','Cancelled')}</small><b>${nCan}</b></div><div><small>${tr('wlTitle')}</small><b>${wl}</b></div></div></div>
  <h2 class="sec">${tr('ordersTitle')}</h2>${os.length?os.map(card).join(''):`<div class="panel">${tr('noOrders')}</div>`}<button class="btn o" onclick="go('wishlist')">${tr('wlTitle')}</button>`;
};

/* reviews remember who wrote them (so admin can see per-user reviews) */
const _pRev=window.pRev;
window.pRev=function(id){const mp=$('#mp');if(mp&&!mp.value.trim()&&currentCustomer)mp.value=currentCustomer;const ph=mp?mp.value.trim():'',n=D.reviews.length;
 const r=_pRev.apply(this,arguments);if(D.reviews.length>n&&ph){D.reviews[0].ph=ph;save()}return r};
const _openP=window.openP;
window.openP=function(){const r=_openP.apply(this,arguments);try{const mp=$('#mp');if(mp&&currentCustomer&&!mp.value)mp.value=currentCustomer}catch(e){}return r};

/* profile photo in the header button */
setInterval(()=>{const b=$('#accb');if(!b)return;const c=currentCustomer&&D.accounts&&D.accounts[currentCustomer],cur=b.querySelector('.u-hav');
 if(!(c&&c.photo&&imgOk(c.photo))){if(cur)cur.remove();return}if(cur&&cur.dataset.s===c.photo)return;if(cur)cur.remove();
 const im=document.createElement('img');im.className='u-hav';im.dataset.s=c.photo;im.alt='';im.src=resolve(c.photo);b.insertBefore(im,b.firstChild)},900);

/* ================= admin: users ================= */
function users(){const m=new Map(),g=ph=>{ph=String(ph||'').trim();if(!ph)return null;if(!m.has(ph))m.set(ph,{ph,name:'',acc:null});return m.get(ph)};
 Object.entries(D.accounts||{}).forEach(([k,a])=>{const u=g(k);if(u){u.acc=a;u.name=a.name||''}});

 <h3 style="margin:16px 0 6px">⭐ রিভিউ</h3>${s.rv.map(r=>{const p=r.pid&&prodOf(r.pid);return `<div class="u-rv"><span class="stars">${star(r.r)}</span> ${p?`<b>${esc(p.n)}</b>`:''} ${r.v?'<span class="vb">✔ Verified</span>':''}<br>${esc(r.t)}<br><small style="color:var(--mu)">${esc(r.d||'')}</small></div>`}).join('')||'<p style="color:var(--mu)">কোনো রিভিউ দেয়নি</p>'}
 <div class="u-danger"><div><b>ইউজার ম্যানেজমেন্ট</b><br><small style="color:var(--mu)">যেকোনো সময় ইউজার ডিলিট করতে পারবেন</small></div><div style="display:flex;gap:8px;flex-wrap:wrap">${a?`<button class="btn o s" onclick="uReset('${esc(E)}')">🔑 পাসওয়ার্ড রিসেট</button>`:''}<button class="btn d s" onclick="uDel('${esc(E)}')">🗑️ ইউজার ডিলিট</button></div></div>`;

 delete D.accounts[ph];delete D.wishlists[ph];delete D.customers[ph];

 save();if(currentCustomer===ph){currentCustomer='';try{localStorage.removeItem('fm_customer')}catch(e){}}
 closeM();toast('ইউজার ডিলিট হয়েছে ✅');if(typeof tab!=='undefined'&&tab==='cus')cus()};

 const x0=Math.max(0,Math.floor(q.x-r)),x1=Math.min(w-1,Math.ceil(q.x+r)),y0=Math.max(0,Math.floor(q.y-r)),y1=Math.min(h-1,Math.ceil(q.y+r));

(()=>{
const money=n=>'৳'+Number(n||0).toLocaleString('en-IN'),live=o=>o.status!=='বাতিল',fd=s=>s?String(s).replace('T',' '):'—';
const nowS=()=>{const d=new Date();let a,b;try{a=d.toLocaleDateString('bn-BD',{weekday:'long',day:'numeric',month:'long',year:'numeric'});b=d.toLocaleTimeString('bn-BD',{hour:'2-digit',minute:'2-digit',hour12:true})}catch(e){a=d.toDateString();b=d.toTimeString().slice(0,5)}return{d:a,t:b,stamp:d.toISOString().slice(0,16).replace(/[:T]/g,'-')}};
const pd=s=>{const m=String(s||'').match(/(\d+)\/(\d+)\/(\d+),?\s*(\d+):(\d+)/);return m?+new Date(+m[3],m[2]-1,+m[1],+m[4],+m[5]):0};
const tm=s=>{const d=new Date(s);return d.getHours()*60+d.getMinutes()};
const ens=()=>{D.camps=D.camps||[];D.campLog=D.campLog||[];D.smsLog=D.smsLog||[];D.fb=D.fb||{rate:1};D.smsC=D.smsC||{rate:.35,auto:false,tpl:'প্রিয় {name}, আপনার অর্ডার #{order} এখন "{status}"। মোট {total}। ধন্যবাদ – '+(D.shop.name||'FreshMart')}};

/* ---------- campaign engine ---------- */
const cState=c=>{if(c.fb)return c.st||'ended';if(c.force)return c.force;const n=Date.now(),s=+new Date(c.start),e=+new Date(c.end);if(c.pid){const p=D.products.find(x=>x.id==c.pid);if(p&&p.s<=0)return'paused'}
 if(n<s)return'scheduled';if(n>e)return'ended';if(c.daily){const m=new Date(),cm=m.getHours()*60+m.getMinutes(),a=tm(c.start),b=tm(c.end);if(a<=b?(cm<a||cm>b):(cm<a&&cm>b))return'idle'}return'running'};

 (c.ads||[]).forEach(id=>{const a=(D.ads||[]).find(x=>x.id==id);if(a){const on=st==='running';if(a.on!==on){a.on=on;ch=1}}})});if(ch&&admin){save();if(tab==='camp')campAdm()}}catch(e){}}

/* Facebook / UTM ট্র্যাকিং: ফেসবুক থেকে আসা ভিজিটরের অর্ডারে src ও ক্যাম্পেইন বসে */
try{const q=new URLSearchParams(location.search);if(q.get('fbclid')||/facebook|fb|instagram/i.test(q.get('utm_source')||''))localStorage.setItem('fm_ref',JSON.stringify({s:/insta/i.test(q.get('utm_source')||'')?'Instagram':'Facebook',c:q.get('utm_campaign')||'',t:Date.now()}))}catch(e){}
const _save=save;save=function(){try{const r=JSON.parse(localStorage.getItem('fm_ref')||'null');if(r&&Date.now()-r.t<6048e5)(D.orders||[]).forEach(o=>{if(!o._t){o._t=1;if(!o.src||o.src==='Store')o.src=r.s;ens();const c=D.camps.find(x=>x.name===r.c||x.id==r.c)||D.camps.find(x=>cState(x)==='running');if(c)o.camp=c.id}});else(D.orders||[]).forEach(o=>o._t=1)}catch(e){}return _save.apply(this,arguments)};

 sales:()=>{const L=D.orders.filter(live);return{title:'সেলস / অর্ডার রিপোর্ট',file:'sales',rows:L,cols:[['অর্ডার',r=>'#'+r.id,56],['তারিখ',r=>r.date,110],['গ্রাহক',r=>r.name,110],['ফোন',r=>r.phone,90],['মোট',r=>r.total,70,1],['লাভ',r=>r.profit||0,60,1],['পেমেন্ট',r=>r.pay,60],['সোর্স',r=>r.src||'Store',70],['স্ট্যাটাস',r=>r.status,60]],sum:[['মোট অর্ডার',L.length+'টি'],['মোট বিক্রি',money(L.reduce((a,o)=>a+o.total,0))],['মোট লাভ',money(L.reduce((a,o)=>a+(o.profit||0),0))]]}},

async function xlsx(R){await lib('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js',()=>window.ExcelJS);
 const wb=new ExcelJS.Workbook(),n=R.cols.length,N=nowS(),G='FF0F7B4F',ws=wb.addWorksheet('Report',{views:[{state:'frozen',ySplit:6,showGridLines:false}]});

 for(let r=1;r<=4;r++){ws.getRow(r).height=H[r-1];for(let c=1;c<=n;c++)ws.getCell(r,c).fill=fill('FF063B29');if(r<4||1)ws.mergeCells(r,2,r,n)}

 const opt={method:o.method||'GET'};
 if(o.body){o.body.set('access_token',c.token);opt.body=o.body}else u.searchParams.set('access_token',c.token);

 return`<div class="panel tw" style="margin-top:14px"><b>🧾 সাম্প্রতিক পোস্ট</b> <button class="btn o s" onclick="fbpLoad()">🔄 রিফ্রেশ</button>${ST.err?`<p style="color:var(--dg)">⚠️ ${esc(ST.err)}</p>`:''}<table class="fbp-t"><tr><th>সময়</th><th>পোস্ট</th><th>রিঅ্যাকশন</th><th></th></tr>${ST.posts.map(row).join('')||'<tr><td colspan="4">কোনো পোস্ট নেই</td></tr>'}</table>${ST.sch.length?`<b style="display:block;margin-top:14px">🕒 শিডিউল করা পোস্ট</b><table class="fbp-t">${ST.sch.map(srow).join('')}</table>`:''}</div>`}

 const st=c=>{let n=0,a=0;(D.orders||[]).forEach(o=>{if(live(o)&&o.camp==c.id){n++;a+=o.total}});return{n,a}};

window.fbpAdm=()=>{const c=cfg();
 const prods=(D.products||[]).map(p=>`<option value="${esc(p.id)}">${esc(p.n)}</option>`).join('');
 $('#ab').innerHTML=`<div class="panel"><h2 style="margin-top:0">📘 ফেসবুক পেজ কন্ট্রোল</h2>

 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn" onclick="fbpSave()">💾 সেভ ও সংযোগ টেস্ট</button><button class="btn d" onclick="fbpDisc()">🔌 টোকেন মুছুন</button></div>

window.fbpPost=async()=>{const c=cfg();if(!c.id||!c.token)return toast('আগে Page ID ও Token সেভ করুন');

 window.fmTenant=function(){panel('🌍 SaaS ব্যবসা ও সাবস্ক্রিপশন',`<p style="color:var(--mu)">SaaS-এ প্রতিটি ব্যবসা (tenant)-এর আলাদা ডেটা, ডোমেইন/সাবডোমেইন, ব্র্যান্ডিং, প্যাকেজ ও বিলিং থাকবে। নিচের তালিকা কেবল লোকাল ডেমো; এটি নিজে থেকে নতুন ব্যবসার অ্যাকাউন্ট বা পেমেন্ট তৈরি করে না।</p><div class="f2 f"><input id="en_name" placeholder="ব্যবসার নাম"><input id="en_owner" placeholder="মালিকের ইমেইল"><select id="en_plan"><option>Starter</option><option>Business</option><option>Enterprise</option></select></div><button class="btn" onclick="fmTenantAdd()">ডেমো ব্যবসা যোগ করুন</button>${E.tenants.map(t=>`<div class="row"><span><b>${escx(t.name)}</b><br><small>${escx(t.owner)}</small></span><b>${escx(t.plan)}</b></div>`).join('')||'<p>এখনো কোনো ব্যবসা যোগ করা হয়নি।</p>'}<hr><b>Production SaaS-এর জন্য আবশ্যক</b><ul><li>Tenant ID-ভিত্তিক database isolation ও Row Level Security</li><li>Subscription billing, invoices, renewal ও failed-payment handling</li><li>Custom domain, per-tenant theme ও feature flags</li><li>Tenant owner, staff ও platform super-admin আলাদা permissions</li></ul>`)};

<script>
/* ===== Product pictures everywhere (admin + customer order views) ===== */
(function(){
const byId=id=>(D.products||[]).find(p=>String(p.id)===String(id));
const byName=n=>{n=String(n||'').trim().toLowerCase();return n?(D.products||[]).find(p=>String(p.n).trim().toLowerCase()===n):null};
window.imKey=p=>{try{const u=rawImgs(p)[0];return u&&!String(u).startsWith('data:')?u:''}catch(e){return ''}};
window.pimgSrc=(id,n,it)=>{try{let p=byId(id),u=p&&allImgs(p)[0];if(u)return u;if(it&&it.im&&imgOk(it.im))return resolve(it.im);p=byName(n);u=p&&allImgs(p)[0];return u||''}catch(e){return ''}};
window.pimg=(id,n,it)=>{const s=pimgSrc(id,n,it);if(s)return `<img class="pth" src="${esc(s)}" alt="${esc(n||'')}" loading="lazy" onclick="pthBig(this,event)">`;const p=byId(id)||byName(n);return `<span class="pth ph">${esc((p&&p.e)||'🛍️')}</span>`};
window.rcThumb=i=>{const s=pimgSrc(i.id,i.n,i);return s?`<img src="${esc(s)}" alt="" style="width:42px;height:42px;object-fit:cover;border-radius:6px;float:left;margin-right:8px">`:''};
window.pthBig=(el,ev)=>{if(ev)ev.stopPropagation();const mb=document.getElementById('mb'),md=document.getElementById('md');if(!mb||!md)return;mb.innerHTML=`<button class="btn o s mx" onclick="closeM()">✕</button><div style="text-align:center"><img src="${esc(el.src)}" alt="" style="max-width:100%;max-height:70vh;border-radius:14px"><p><b>${esc(el.alt||'')}</b></p></div>`;md.classList.add('on')};

/* Admin: wherever a product NAME appears as text, put its picture next to it */
const NOSCAN=['prod','wm','perf','mk','brand'];           /* these tabs already show pictures */
const SKIPTAG=/^(SELECT|OPTION|TEXTAREA|SCRIPT|STYLE|TH|H1|H2|H3|H4|BUTTON)$/;
let obs=null,queued=0;
function buildIdx(){const m=new Map();(D.products||[]).forEach(p=>{let u;try{u=allImgs(p)[0]}catch(e){}if(u){const k=String(p.n||'').trim().toLowerCase();if(k.length>1&&!m.has(k))m.set(k,{p,u})}});return m}
function find(idx,t){t=t.replace(/\s+/g,' ').trim();if(t.length<2||t.length>160)return null;const st=t.replace(/^[^\p{L}\p{N}]+/u,'').trim();const tries=[t,st];[t,st].forEach(x=>{const c=x.split(/ [×·—–|] | \(/)[0].trim();if(c&&c!==x)tries.push(c)});for(const k of tries){const h=idx.get(k.toLowerCase());if(h)return h}return null}
function hasPic(el){for(let a=el,i=0;a&&i<3;a=a.parentElement,i++){if(a.id==='ab')break;for(const c of a.children){if(c.matches&&c.matches('img:not(.pth),.ph,.pth'))return true}}return false}
function scan(){queued=0;const ab=document.getElementById('ab');if(!ab||!document.querySelector('.adm'))return;let t='';try{t=(typeof tab!=='undefined'&&tab)||''}catch(e){}if(NOSCAN.includes(t))return;
 const idx=buildIdx();if(!idx.size)return;const w=document.createTreeWalker(ab,NodeFilter.SHOW_TEXT),L=[];let n;while(n=w.nextNode()){const pe=n.parentElement;if(!pe||SKIPTAG.test(pe.tagName)||pe.closest('select,.pth'))continue;if(!n.nodeValue.trim())continue;L.push(n)}
 if(obs)obs.disconnect();
 try{for(const n of L){const h=find(idx,n.nodeValue);if(!h)continue;const pe=n.parentElement;let pv=n.previousSibling;while(pv&&pv.nodeType===3&&!pv.nodeValue.trim())pv=pv.previousSibling;if(pv&&pv.nodeType===1&&pv.classList.contains('pth'))continue;if(hasPic(pe))continue;
  const img=document.createElement('img');img.className='pth';img.src=h.u;img.alt=h.p.n;img.loading='lazy';img.onclick=e=>pthBig(img,e);pe.insertBefore(img,n);

let h=`<div class="panel"><div class="fm-pfh"><label class="fm-sw"><input type="checkbox" ${d.on?'checked':''} onchange="fmDsTog(this.checked)"><i></i></label><div><b style="font-size:1.1rem">📦 ড্রপশিপিং বিজনেস ${d.on?'— চালু':'— বন্ধ'}</b><br><small style="color:var(--mu)">চালু করলে ড্রপশিপ পণ্যের স্টক আনলিমিটেড থাকে, অর্ডার এলে সাপ্লায়ারের জন্য অর্ডার তৈরি হয়। বন্ধ করলে সব সাধারণ নিয়মে চলে।</small></div></div></div>`;

<div class="panel tw" style="margin-top:14px"><b>🛍️ কোন পণ্য ড্রপশিপ হবে</b><table><tr><th>ড্রপশিপ</th><th>পণ্য</th><th>সাপ্লায়ার</th><th>সাপ্লায়ার দাম (৳)</th><th>বিক্রয়</th><th>মার্জিন</th></tr>${D.products.map(p=>{const x=p.ds||{},pr=pp(p);return `<tr><td><label class="fm-sw" style="transform:scale(.8)"><input type="checkbox" ${x.on?'checked':''} onchange="fmDsP(${p.id},'on',this.checked)"><i></i></label></td><td>${esc(p.n)}</td><td><select onchange="fmDsP(${p.id},'sup',this.value)" style="width:auto"><option value="">—</option>${d.sup.map(s=>`<option value="${s.id}" ${x.sup===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></td><td><input type="number" min="0" value="${+x.cost||''}" style="width:100px" onchange="fmDsP(${p.id},'cost',this.value)"></td><td>${tk(pr)}</td><td>${x.on&&x.cost?`<b style="color:${pr-x.cost>=0?'var(--pr)':'var(--dg)'}">${tk(pr-x.cost)}</b>`:'—'}</td></tr>`}).join('')}</table></div>

if(P('flash')&&!adm&&app&&(!end||end>Date.now())){if(!fb){fb=document.createElement('div');fb.id='fmFlash';app.insertAdjacentElement('beforebegin',fb)}const tick=()=>{const s=Math.max(0,Math.floor((end-Date.now())/1000)),f=n=>String(n).padStart(2,'0');if(end&&!s){fb.remove();clearInterval(fT);return}fb.innerHTML=`<span>${esc(C('flashT','⚡ ফ্ল্যাশ সেল চলছে!'))}</span>${end?`<b>${Math.floor(s/86400)}d ${f(Math.floor(s%86400/3600))}:${f(Math.floor(s%3600/60))}:${f(s%60)}</b>`:''}${C('flashLink','')?`<a href="${esc(C('flashLink',''))}">${bn()?'দেখুন →':'Shop →'}</a>`:''}`};tick();fT=setInterval(tick,1000)}else if(fb)fb.remove();

 <div class="panel" style="margin-top:14px"><b>🛡️ অ্যাক্টিভিটি</b>${s.log.slice(0,40).map(l=>`<div class="fmx-m">${esc(l[0])} · <b>${esc(l[1])}</b> · ${esc(l[2])}</div>`).join('')||'<p>কিছু নেই</p>'}</div>`)};

const SY={ঘড়ি:'watch',জুতা:'shoes',স্যান্ডেল:'shoes',পাঞ্জাবি:'men dress',শার্ট:'men dress',শাড়ি:'women dress',ড্রেস:'dress',ফোন:'phone',মোবাইল:'phone',পারফিউম:'perfume',আতর:'perfume',বই:'book',হেডফোন:'headphone',কসমেটিক:'cosmetic',লিপস্টিক:'cosmetic',গ্যাজেট:'gadget',পাওয়ার:'power',স্পিকার:'speaker'};
const pb=ps=>`<div class="chl">${ps.slice(0,4).map(p=>`<button type="button" onclick="openP(${p.id})">${esc(p.e||'')} ${esc(p.n)} · ${tk(pp(p))}${p.s<=0?' (স্টক শেষ)':''}</button>`).join('')}</div>`;
function rule(raw){const l=dg(raw.toLowerCase()),nums=l.match(/\d{3,}/g)||[],has=(...w)=>w.some(x=>l.includes(x));
 const ph=nums.find(x=>/^(88)?01[3-9]\d{8}$/.test(x)),oid=nums.find(x=>x!==ph&&D.orders.some(o=>String(o.id)===x));
 if(oid){const o=D.orders.find(o=>String(o.id)===oid);return`📦 অর্ডার #${o.id}: <b>${esc(o.status)}</b> · ${tk(o.total)}${o.courier?`<br>কুরিয়ার: ${esc(o.courier)} ${esc(o.track||'')}`:''}`}
 if(ph&&has('পয়েন্ট','point','loyal','লয়্যাল'))return`⭐ এই নম্বরের ব্যালেন্স: <b>${bal(ph)} পয়েন্ট</b> (১ পয়েন্ট = ${tk(F().loy.val)})`;
 if(ph){const os=D.orders.filter(o=>pk(o.phone)===pk(ph)).slice(0,3);return os.length?os.map(o=>`#${o.id} · <b>${esc(o.status)}</b> · ${tk(o.total)}`).join('<br>'):'এই নম্বরে কোনো অর্ডার পাইনি।'}
 if(has('পয়েন্ট','point','loyal','লয়্যাল')){const f=F().loy;return`প্রতি ${tk(f.per)} কেনাকাটায় ${f.earn} পয়েন্ট; ১ পয়েন্ট = ${tk(f.val)}। ব্যালেন্স জানতে আপনার ফোন নম্বর লিখুন।`}
 if(has('ডেলিভারি চার্জ','delivery','shipping','ডেলিভারি কত','চার্জ'))return`🚚 ঢাকার ভেতরে ${tk(feeOf('in'))}, ঢাকার বাইরে ${tk(feeOf('out'))}${D.shop.free>0?`; ${tk(D.shop.free)}-এর বেশি কিনলে ফ্রি`:''}।`;
 if(has('পেমেন্ট','payment','bkash','বিকাশ','নগদ','nagad','cod','ক্যাশ'))return'💳 পেমেন্ট: '+((D.shop.pm||[]).filter(x=>x.on).map(x=>esc(x.n)).join(', ')||'ক্যাশ অন ডেলিভারি');
 if(has('কুপন','coupon','ডিসকাউন্ট','discount','অফার','offer')){const ds=D.products.filter(p=>p.disc).slice(0,4),cs=(D.coupons||[]).slice(0,3).map(c=>esc(c.code)+' ('+c.pct+'%)');return(cs.length?'🎁 কুপন: '+cs.join(', ')+'<br>':'')+(ds.length?'ডিসকাউন্টে পণ্য:'+pb(ds):'এখন কোনো অফার চালু নেই।')}
 const m=l.match(/(\d{3,6})/),bud=m&&has('মধ্যে','under','below','বাজেট','budget','নিচে','টাকার')?+m[1]:0;
 let key=Object.keys(SY).find(k=>l.includes(k));key=key?SY[key]:'';
 const w=l.split(/[\s,?।]+/).filter(x=>x.length>2&&!/^\d+$/.test(x));
 let ps=D.products.filter(p=>{const s=(p.n+' '+p.c).toLowerCase();return key?s.includes(key):w.some(x=>s.includes(x))});
 if(!ps.length&&bud)ps=D.products.slice();
 if(bud)ps=ps.filter(p=>pp(p)<=bud).sort((a,b)=>pp(b)-pp(a));
 if(ps.length)return`${bud?`${tk(bud)}-এর মধ্যে সেরা অপশন:`:'এগুলো পেয়েছি:'}${pb(ps)}${ps.length===1?`<small>স্টক: ${ps[0].s>0?ps[0].s+' পিস':'শেষ'}</small>`:''}`;
 return null}
async function llm(raw){const b=F().bot;if(!b.llm||!apiBase())return null;try{const j=await apiCall('/api/chat',{messages:chMsgs.slice(-8).map(m=>({role:m.b?'assistant':'user',content:String(m.t).replace(/<[^>]+>/g,' ')})),shop:{name:D.shop.name,phone:D.shop.phone,feeIn:feeOf('in'),feeOut:feeOf('out'),free:D.shop.free},products:D.products.slice(0,40).map(p=>({id:p.id,n:p.n,c:p.c,p:pp(p),s:p.s}))},{timeout:15000});return j.reply?esc(j.reply).replace(/\n/g,'<br>'):null}catch(e){return null}}
